name: Build Nairacoin

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libboost-all-dev libssl-dev libunbound-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release -j$(nproc)

    - name: Stage nairacoind
      run: |
        BIN="$(find build -type f -name nairacoind | head -1)"
        test -n "$BIN"
        mkdir -p dist
        cp "$BIN" dist/nairacoind
        file dist/nairacoind
        ldd dist/nairacoind

    - uses: actions/upload-artifact@v4
      with:
        name: nairacoind
        path: dist/nairacoind
        if-no-files-found: error
        retention-days: 14
