name: Shop window Pages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - shop/**
      - .github/workflows/shop-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: shop
      - id: deploy
        uses: actions/deploy-pages@v4
